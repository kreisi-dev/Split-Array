name: Publish to PowerShell Gallery

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

      - name: Validate manifest
        shell: pwsh
        run: Test-ModuleManifest ./SplitArray/SplitArray.psd1

      - name: Publish module
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw 'Secret PSGALLERY_API_KEY ist nicht gesetzt.' }
          Publish-PSResource -Path ./SplitArray -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY
