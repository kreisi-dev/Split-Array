name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Pester (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        shell: pwsh
        run: Install-Module InvokeBuild, PSDepend -Force -Scope CurrentUser

      - name: Run Pester tests
        shell: pwsh
        run: Invoke-Build Deps, Test

  test-ps51:
    name: Pester (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        shell: powershell
        run: |
          # Without TLS 1.2 the PowerShellGet calls cannot reach the PSGallery on PS 5.1.
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module InvokeBuild, PSDepend -Force -Scope CurrentUser

      - name: Run Pester tests
        shell: powershell
        run: Invoke-Build Deps, Test

  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        shell: pwsh
        run: Install-Module InvokeBuild, PSDepend -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: Invoke-Build Deps, Lint
